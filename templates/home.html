{% extends 'base.html' %}

{% block conteudo %}

<!-- Split Hero Section -->
<section class="container-fluid p-0 overflow-hidden split-hero">
    <div class="row g-0 min-vh-100">
        <!-- Left Side: Brand Focus -->
        <div class="fundo_img col-lg-6 hero-left d-flex align-items-center justify-content-center p-5 min-vh-50">
            <div class="text-center position-relative z-1">
                <img alt="Kinetic Logistics Logo" class="img-fluid mb-4"
                     src="/static/img/logo.png"
                     style="max-width: 500px; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));">
            </div>
        </div>
        <!-- Right Side: Interaction Area -->
        <div class="col-lg-6 bg-white d-flex align-items-center justify-content-center p-4 p-md-5">
            <div style="max-width: 480px; width: 100%;">
                <div class="mb-5">
                    <span class="text-uppercase tracking-widest fw-bold mb-2 d-block"
                          style="color: #fd761a; font-size: 12px; letter-spacing: 2px;">Horário-Real Entregas</span>
                    <h2 class="h1 mb-3 brand-font">Rastrear Encomenda</h2>
                    <p class="text-muted">Localize seus ativos globais em tempo real com precisão arquitetônica e dados de telemetria integrados</p>
                </div>
            </div>

        </div>
    </div>
</section>


{% endblock %}
